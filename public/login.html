<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameOn - התחברות</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .auth-container {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 30px;
            text-align: center;
        }

        .auth-container h1 {
            color: #1e3c72;
            margin-top: 0;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #ecf0f1;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #7f8c8d;
            transition: 0.3s;
        }

        .tab.active {
            color: #2980b9;
            border-bottom: 3px solid #2980b9;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #2980b9;
        }

        .btn-submit {
            width: 90%;
            padding: 12px;
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-guest {
            width: 90%;
            padding: 12px;
            background: #ecf0f1;
            color: #7f8c8d;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .btn-guest:hover {
            background: #bdc3c7;
            color: white;
        }

        .message-box {
            margin-top: 15px;
            font-size: 14px;
            color: #e74c3c;
        }

        /* עיצוב למילה "או" עם קווים בצדדים */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #7f8c8d;
            margin: 20px auto;
            width: 90%;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ecf0f1;
        }

        .divider span {
            padding: 0 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <h1>GameOn ⚽🏀</h1>
        <p>ברוכים הבאים לרשת החברתית לספורטאים</p>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">התחברות</div>
            <div class="tab" onclick="switchTab('register')">הרשמה חדשה</div>
        </div>

        <div id="login-section" class="form-section active">
            <input type="text" id="login-username" placeholder="שם משתמש">
            <input type="password" id="login-password" placeholder="סיסמה">
            <button class="btn-submit" onclick="login()">היכנס</button>
        </div>

        <div id="register-section" class="form-section">
            <input type="text" id="reg-username" placeholder="שם משתמש">
            <input type="email" id="reg-email" placeholder="דואר אלקטרוני">
            <input type="password" id="reg-password" placeholder="סיסמה">
            <button class="btn-submit" onclick="register()">הירשם למערכת</button>
        </div>

        <button class="btn-guest" onclick="continueAsGuest()">המשך כאורח (צפייה בלבד במפה)</button>

        <div id="auth-msg" class="message-box"></div>

        <!-- המילה "או" מוצגת מעל כפתור גוגל -->
        <div class="divider">
            <span>או</span>
        </div>

        <!-- כפתור גוגל מעוצב עם לוגו SVG שאינו נשבר -->
        <div style="text-align: center;">
            <a href="/api/auth/google"
                style="display: flex; align-items: center; justify-content: center; background-color: white; border: 1px solid #dadce0; padding: 10px; border-radius: 8px; text-decoration: none; color: #3c4043; font-family: sans-serif; font-weight: 500; font-size: 14px; transition: background-color 0.3s; width: 90%; margin: 0 auto; box-sizing: border-box; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);">
                <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"
                    style="width: 20px; height: 20px; margin-left: 10px;">
                    <path fill="#EA4335"
                        d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z">
                    </path>
                    <path fill="#4285F4"
                        d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z">
                    </path>
                    <path fill="#FBBC05"
                        d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z">
                    </path>
                    <path fill="#34A853"
                        d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z">
                    </path>
                </svg>
                התחבר באמצעות Google
            </a>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            $('.tab').removeClass('active');
            $('.form-section').removeClass('active');
            $('#auth-msg').text('');
            if (tabName === 'login') {
                $('.tab').eq(0).addClass('active');
                $('#login-section').addClass('active');
            } else {
                $('.tab').eq(1).addClass('active');
                $('#register-section').addClass('active');
            }
        }

        function login() {
            const username = $('#login-username').val();
            const password = $('#login-password').val();
            $.ajax({
                url: '/api/auth/login', type: 'POST', data: { username, password },
                success: function (res) {
                    sessionStorage.removeItem('pitchConnectGuest');
                    window.location.href = '/';
                },
                error: function (err) { $('#auth-msg').text(err.responseJSON?.message || 'שגיאה בהתחברות'); }
            });
        }

        function register() {
            const username = $('#reg-username').val();
            const email = $('#reg-email').val();
            const password = $('#reg-password').val();
            $.ajax({
                url: '/api/auth/register', type: 'POST', data: { username, email, password },
                success: function (res) {
                    $('#auth-msg').css('color', '#27ae60').text(res.message);
                    setTimeout(() => switchTab('login'), 2000);
                },
                error: function (err) { $('#auth-msg').css('color', '#e74c3c').text(err.responseJSON?.message || 'שגיאה בהרשמה'); }
            });
        }

        function continueAsGuest() {
            sessionStorage.setItem('pitchConnectGuest', 'true');
            window.location.href = '/';
        }
    </script>
</body>

</html>
