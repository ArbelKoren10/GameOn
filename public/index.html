<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameOn - מצא את המגרש שלך</title>

    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/supercluster@8.0.1/dist/supercluster.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background: white;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            height: 60px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #1e3c72;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: #7f8c8d;
            font-weight: normal;
            display: none;
        }

        .user-menu-container {
            position: relative;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 180, 219, 0.3);
            border: 2px solid white;
            transition: transform 0.2s;
        }

        .user-avatar:active {
            transform: scale(0.95);
        }

        .dropdown-menu {
            position: absolute;
            top: 50px;
            left: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 180px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 101;
        }

        .dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-header {
            padding: 15px;
            border-bottom: 1px solid #f1f2f6;
            background: #fcfcfc;
        }

        .dropdown-header span {
            display: block;
            font-size: 14px;
            color: #7f8c8d;
        }

        .dropdown-header b {
            color: #2c3e50;
            font-size: 15px;
        }

        .dropdown-item {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e74c3c;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .dropdown-item:hover {
            background: #fdf5f5;
        }

        .filters-container {
            width: 100%;
            background: white;
            padding: 10px 0;
            border-bottom: 1px solid #ecf0f1;
            margin-bottom: 20px;
        }

        .filters {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            padding: 0 20px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .filters::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background: #f1f2f6;
            color: #576574;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .filter-btn:active {
            transform: scale(0.95);
        }

        .filter-btn.active {
            background: #1e3c72;
            color: white;
            box-shadow: 0 4px 10px rgba(30, 60, 114, 0.2);
        }

        #map {
            height: 550px;
            width: calc(100% - 40px);
            max-width: 1400px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: none;
            overflow: hidden;
        }

        .custom-marker {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            border: 2px solid white;
            transition: transform 0.2s;
        }

        .custom-marker:hover {
            transform: scale(1.15);
            z-index: 10;
        }

        .cluster-marker {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(52, 152, 219, 0.95);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            border: 3px solid white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: 0.2s;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .cluster-marker:hover {
            transform: scale(1.1);
            background: rgba(41, 128, 185, 1);
        }

        .maplibregl-popup-content {
            border-radius: 16px !important;
            padding: 0 !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2) !important;
            border: none !important;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }

        .maplibregl-popup-close-button {
            left: 5px;
            right: auto;
            font-size: 24px;
            color: #ffffff;
            padding: 5px 12px;
            transition: color 0.2s;
            z-index: 10;
        }

        .maplibregl-popup-close-button:hover {
            color: #ff7675;
            background: transparent;
        }

        .maplibregl-popup-tip {
            border-top-color: #ffffff !important;
        }

        .custom-popup {
            min-width: 220px;
        }

        .popup-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 25px 15px 15px;
            position: relative;
        }

        .popup-emoji {
            font-size: 35px;
            margin-bottom: 5px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
        }

        .popup-title {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .popup-body {
            padding: 20px 15px;
            background: #ffffff;
        }

        .popup-sport-type {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .court-status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 20px;
            background-color: #28a745;
            color: white;
        }

        .join-chat-btn {
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 180, 219, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .join-chat-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 180, 219, 0.5);
        }

        #court-workspace {
            display: none;
            width: calc(100% - 40px);
            max-width: 1400px;
            flex-direction: column;
            gap: 25px;
            margin: 40px 0;
        }

        .workspace-row {
            display: flex;
            gap: 25px;
        }

        #chat-panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        #chat-title {
            text-align: center;
            color: #1e3c72;
            margin-top: 0;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 15px;
        }

        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 10px;
            height: 350px;
        }

        .message {
            background: #f1f2f6;
            padding: 12px 15px;
            border-radius: 15px;
            margin-bottom: 12px;
            font-size: 14px;
            border-right: 4px solid #3498db;
        }

        .message-sys {
            background: transparent;
            text-align: center;
            font-size: 12px;
            color: #95a5a6;
            border: none;
            font-style: italic;
        }

        #chat-input-area {
            display: flex;
            gap: 10px;
        }

        #chat-input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #dfe4ea;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s;
        }

        #chat-input:focus {
            border-color: #3498db;
        }

        #send-btn {
            background: #2ed573;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        #send-btn:hover {
            background: #26de81;
        }

        @media (max-width: 900px) {
            .header-content {
                padding: 10px 15px;
            }

            .brand-subtitle {
                display: none;
            }

            .filters {
                padding: 0 15px;
            }

            .workspace-row {
                flex-direction: column;
            }

            #map {
                height: 450px;
                width: 92%;
                border-radius: 15px;
            }

            #court-workspace {
                width: 92%;
                margin: 20px 0;
            }
        }

        @media (min-width: 901px) {
            .brand-subtitle {
                display: block;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <div class="brand">
                <h1>GameOn</h1>
                <span class="brand-subtitle">רשת הספורט שלך</span>
            </div>

            <div class="user-menu-container">
                <div class="user-avatar" id="user-avatar-btn" onclick="toggleUserMenu()">
                    ?
                </div>

                <div class="dropdown-menu" id="user-dropdown">
                    <div class="dropdown-header">
                        <span>מחובר כ-</span>
                        <b id="dropdown-username">טוען...</b>
                    </div>
                    <div class="dropdown-item" onclick="logout()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        התנתק מהמערכת
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="filters-container">
        <div class="filters">
            <button class="filter-btn active" data-filter="all">הכל</button>
            <button class="filter-btn" data-filter="soccer">⚽ כדורגל</button>
            <button class="filter-btn" data-filter="basketball">🏀 כדורסל</button>
            <button class="filter-btn" data-filter="tennis">🎾 טניס</button>
            <button class="filter-btn" data-filter="volleyball">🏐 כדורעף</button>
        </div>
    </div>

    <div id="map"></div>

    <div id="court-workspace">
        <div class="workspace-row">
            <div id="chat-panel">
                <h3 id="chat-title">טוען נתונים...</h3>
                <div id="chat-messages"></div>
                <div id="chat-input-area">
                    <input type="text" id="chat-input" placeholder="הקלד הודעה...">
                    <button id="send-btn">שלח</button>
                </div>
            </div>
            <div id="react-tactics-root" style="flex: 2;"></div>
        </div>
    </div>

    <script>
        let isGuestUser = false;
        let currentUser = null;
        let map;
        let allFeatures = [];
        let activeMarkers = {};

        const socket = io();

        const ZOOM_THRESHOLD = window.innerWidth < 900 ? 11.5 : 13;

        function toggleUserMenu() {
            document.getElementById('user-dropdown').classList.toggle('active');
        }

        document.addEventListener('click', function (event) {
            const container = document.querySelector('.user-menu-container');
            if (!container.contains(event.target)) {
                document.getElementById('user-dropdown').classList.remove('active');
            }
        });

        $.ajax({
            url: '/api/auth/status',
            type: 'GET',
            success: function (res) {
                if (res.isGuest) {
                    if (!sessionStorage.getItem('pitchConnectGuest')) {
                        window.location.href = '/login.html';
                    } else {
                        isGuestUser = true;
                        $('#dropdown-username').text('אורח (צפייה בלבד)');
                        $('#user-avatar-btn').text('?').css('background', '#95a5a6');
                    }
                } else {
                    currentUser = res.user.username;
                    $('#dropdown-username').text(currentUser);
                    const firstLetter = currentUser.charAt(0).toUpperCase();
                    $('#user-avatar-btn').text(firstLetter);
                }
            },
            error: function () { window.location.href = '/login.html'; }
        });

        function logout() {
            sessionStorage.removeItem('pitchConnectGuest');
            $.post('/api/auth/logout', function () { window.location.href = '/login.html'; });
        }

        function getSportStyle(osmSport) {
            if (!osmSport) return { code: 'other', name: 'מגרש פתוח', icon: '📍', color: '#95a5a6' };
            if (osmSport.includes('soccer')) return { code: 'soccer', name: 'כדורגל', icon: '⚽', color: '#27ae60' };
            if (osmSport.includes('basketball')) return { code: 'basketball', name: 'כדורסל', icon: '🏀', color: '#e67e22' };
            if (osmSport.includes('tennis')) return { code: 'tennis', name: 'טניס', icon: '🎾', color: '#f1c40f' };
            if (osmSport.includes('volleyball')) return { code: 'volleyball', name: 'כדורעף', icon: '🏐', color: '#9b59b6' };
            return { code: 'other', name: 'ספורט מעורב', icon: '📍', color: '#34495e' };
        }

        function updateMarkers() {
            if (!map) return;

            const currentZoom = map.getZoom();

            if (currentZoom < ZOOM_THRESHOLD) {
                Object.keys(activeMarkers).forEach(removeMarker);
                $('#zoom-warning').fadeIn(200);
                return;
            }

            $('#zoom-warning').fadeOut(200);

            const activeFilter = $('.filter-btn.active').data('filter');
            const bounds = map.getBounds();

            allFeatures.forEach(court => {
                if (activeFilter !== 'all' && court.style.code !== activeFilter) {
                    removeMarker(court.id);
                    return;
                }
                const isVisible = bounds.contains([court.lon, court.lat]);
                if (isVisible) { addMarker(court); }
                else { removeMarker(court.id); }
            });
        }

        function addMarker(court) {
            if (activeMarkers[court.id]) return;

            const el = document.createElement('div');
            el.className = 'custom-marker';
            el.innerHTML = court.style.icon;
            el.style.backgroundColor = court.style.color;

            const popupContent = `
                <div class="custom-popup">
                    <div class="popup-header">
                        <div class="popup-emoji">${court.style.icon}</div>
                        <h3 class="popup-title">${court.name || 'מגרש ספורט'}</h3>
                    </div>
                    <div class="popup-body">
                        <div class="popup-sport-type">
                            <span>סוג ספורט:</span>
                            <strong>${court.style.name}</strong>
                        </div>
                        <div id="status-${court.id}" class="court-status-badge">🟢 פנוי (0 שחקנים)</div>
                        <button class="join-chat-btn" data-id="${court.id}" data-name="${court.name || 'מגרש ספורט'}">
                            <span>היכנס למגרש ולצ'אט</span>
                            <span>💬</span>
                        </button>
                    </div>
                </div>
            `;

            const popup = new maplibregl.Popup({ offset: 25, closeButton: true }).setHTML(popupContent);

            const marker = new maplibregl.Marker({ element: el })
                .setLngLat([court.lon, court.lat])
                .setPopup(popup)
                .addTo(map);

            activeMarkers[court.id] = marker;
        }

        function removeMarker(id) {
            if (activeMarkers[id]) {
                activeMarkers[id].remove();
                delete activeMarkers[id];
            }
        }

        socket.on('court_status_update', (data) => {
            const badge = document.getElementById(`status-${data.courtId}`);
            if (badge) {
                if (data.count === 0) {
                    badge.innerHTML = '🟢 פנוי (0 שחקנים)';
                    badge.style.backgroundColor = '#28a745';
                    badge.style.color = 'white';
                } else if (data.count >= 1 && data.count <= 9) {
                    badge.innerHTML = `🟡 פעיל מומלץ להצטרף! (${data.count} שחקנים)`;
                    badge.style.backgroundColor = '#ffc107';
                    badge.style.color = 'black';
                } else {
                    badge.innerHTML = `🔴 עמוס (${data.count} שחקנים)`;
                    badge.style.backgroundColor = '#dc3545';
                    badge.style.color = 'white';
                }
            }
        });

        $(document).ready(function () {
            let currentRoom = null;
            const mapTilerKey = '26daLsnzWZ7lkKIB6mTj';

            function leaveCurrentCourt() {
                if (currentRoom) {
                    $('#court-workspace').fadeOut(300);
                    socket.emit('leave_court_room', currentRoom);
                    currentRoom = null;
                }
            }

            $('#map').css('position', 'relative').append(`
                <div id="zoom-warning" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(44, 62, 80, 0.95); color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1000; pointer-events: none; display: none;">
                    🔍 התקרב קצת כדי לראות מגרשים
                </div>
                <div id="loading-courts" style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: #f39c12; color: white; padding: 8px 15px; border-radius: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1000; pointer-events: none;">
                    ⏳ טוען נתונים מהלוויין...
                </div>
            `);

            maplibregl.setRTLTextPlugin('https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js', null, true);

            map = new maplibregl.Map({
                container: 'map',
                style: `https://api.maptiler.com/maps/streets-v2/style.json?key=${mapTilerKey}`,
                center: [34.7925, 31.9730],
                zoom: 11,
                pitch: 45
            });

            map.addControl(new maplibregl.NavigationControl(), 'top-right');

            const geolocate = new maplibregl.GeolocateControl({
                positionOptions: { enableHighAccuracy: true },
                trackUserLocation: true,
                showUserHeading: true
            });
            map.addControl(geolocate, 'bottom-right');

            map.on('moveend', updateMarkers);
            map.on('zoomend', updateMarkers);

            map.on('popupclose', function () {
                leaveCurrentCourt();
            });

            map.on('load', function () {
                geolocate.trigger();
                fetch('/courts.json')
                    .then(response => {
                        if (!response.ok) throw new Error('Network error');
                        return response.json();
                    })
                    .then(data => {
                        allFeatures = data.elements.map(el => {
                            const lat = el.lat || (el.center && el.center.lat);
                            const lon = el.lon || (el.center && el.center.lon);
                            const sport = el.tags ? el.tags.sport : null;
                            const style = getSportStyle(sport);
                            const name = (el.tags && el.tags.name) ? el.tags.name : style.name;

                            return { id: `${el.type}_${el.id}`, lat: lat, lon: lon, name: name, style: style };
                        }).filter(court => court.lat && court.lon);

                        $('#loading-courts').fadeOut(300);
                        updateMarkers();
                    })
                    .catch(err => {
                        console.error("Local Error:", err);
                        $('#loading-courts').css('background', '#e74c3c').text('❌ שגיאה בטעינת מגרשים.');
                    });
            });

            $('.filter-btn').click(function () {
                $('.filter-btn').removeClass('active');
                $(this).addClass('active');
                Object.keys(activeMarkers).forEach(removeMarker);
                leaveCurrentCourt();
                updateMarkers();
            });

            $(document).on('click', '.join-chat-btn', function () {
                if (isGuestUser) {
                    alert('אורחים יכולים לצפות במפה בלבד. עליך להירשם או להתחבר כדי להיכנס למגרש ולתאם משחקים!');
                    window.location.href = '/login.html';
                    return;
                }

                const courtId = $(this).data('id');
                const courtName = $(this).data('name');

                if (currentRoom === courtId) {
                    leaveCurrentCourt();
                    return;
                }

                if (currentRoom && currentRoom !== courtId) {
                    $('#chat-messages').empty();
                    socket.emit('leave_court_room', currentRoom);
                }

                currentRoom = courtId;
                $('#court-workspace').fadeIn(300).css('display', 'flex');

                window.dispatchEvent(new CustomEvent('court_changed', { detail: { courtName: courtName, courtId: courtId } }));
                socket.emit('join_court_room', courtId);

                $('html, body').animate({ scrollTop: $("#court-workspace").offset().top - 20 }, 500);
            });

            socket.on('chat_history', function (messages) {
                $('#chat-messages').empty();
                if (messages.length === 0) {
                    $('#chat-messages').append('<div class="message-sys">אין הודעות קודמות במגרש זה. התחל את השיחה!</div>');
                } else {
                    messages.forEach(msg => {
                        const style = msg.sender === currentUser ? 'background:#d4edda; border-right:4px solid #28a745;' : '';
                        $('#chat-messages').append(`<div class="message" style="${style}"><b>${msg.sender}:</b> ${msg.text} <br><small>${msg.time}</small></div>`);
                    });
                    $('#chat-messages').scrollTop($('#chat-messages')[0].scrollHeight);
                }
            });

            $('#send-btn').click(function () {
                const text = $('#chat-input').val().trim();
                if (text && currentRoom) {
                    const messageData = { courtId: currentRoom, sender: currentUser, text: text, time: new Date().toLocaleTimeString('he-IL') };
                    $('#chat-messages').append(`<div class="message" style="background:#d4edda; border-right:4px solid #28a745;"><b>${messageData.sender}:</b> ${messageData.text} <br><small>${messageData.time}</small></div>`);
                    $('#chat-input').val('');
                    $('#chat-messages').scrollTop($('#chat-messages')[0].scrollHeight);
                    socket.emit('send_message', messageData);
                }
            });

            socket.on('receive_message', function (data) {
                if (data.sender !== currentUser) {
                    const isSystem = data.sender === 'מערכת';
                    const msgClass = isSystem ? 'message message-sys' : 'message';
                    $('#chat-messages').append(`<div class="${msgClass}"><b>${data.sender}:</b> ${data.text} <br><small>${data.time}</small></div>`);
                    $('#chat-messages').scrollTop($('#chat-messages')[0].scrollHeight);
                }
            });
        });
    </script>

    <script type="text/babel">
        const CourtWorkspace = () => {
            const [activeTab, setActiveTab] = React.useState('schedule');
            const [activeCourt, setActiveCourt] = React.useState({ id: null, name: 'בחר מגרש מהמפה' });

            const [events, setEvents] = React.useState([]);
            const [gallery, setGallery] = React.useState([]);

            const [selectedDate, setSelectedDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [reservations, setReservations] = React.useState([]);
            const [bookingStatus, setBookingStatus] = React.useState('');

            const [showEventForm, setShowEventForm] = React.useState(false);
            const [newEvent, setNewEvent] = React.useState({ title: '', eventType: 'משחק אימון', description: '', eventDate: '' });
            const [selectedFile, setSelectedFile] = React.useState(null);

            const canvasRef = React.useRef(null);
            const [isDrawing, setIsDrawing] = React.useState(false);

            // ==========================================
            // האזנה לעדכוני שריונים מ-Socket.io בזמן אמת
            // ==========================================
            React.useEffect(() => {
                const handleReservationUpdate = (data) => {
                    // מושכים נתונים חדשים רק אם העדכון שייך למגרש ולתאריך שאנחנו צופים בהם עכשיו
                    if (activeCourt.id === data.courtId && selectedDate === data.date) {
                        fetchReservations(activeCourt.id, selectedDate);
                    }
                };

                socket.on('refresh_reservations', handleReservationUpdate);

                return () => {
                    socket.off('refresh_reservations', handleReservationUpdate);
                };
            }, [activeCourt.id, selectedDate]);

            React.useEffect(() => {
                const handleCourtChange = (e) => {
                    setActiveCourt({ id: e.detail.courtId, name: e.detail.courtName });
                    fetchEvents(e.detail.courtId);
                    fetchGallery(e.detail.courtId);
                    fetchReservations(e.detail.courtId, selectedDate);
                    clearBoard();
                };
                window.addEventListener('court_changed', handleCourtChange);
                return () => window.removeEventListener('court_changed', handleCourtChange);
            }, [selectedDate]);

            React.useEffect(() => {
                if (activeCourt.id) {
                    fetchReservations(activeCourt.id, selectedDate);
                }
            }, [selectedDate]);

            const fetchEvents = async (courtId) => {
                try {
                    const res = await fetch(`/api/activity/events/${courtId}`);
                    const data = await res.json();
                    setEvents(data);
                } catch (err) { console.error('Error fetching events:', err); }
            };

            const fetchGallery = async (courtId) => {
                try {
                    const res = await fetch(`/api/activity/gallery/${courtId}`);
                    const data = await res.json();
                    setGallery(data);
                } catch (err) { console.error('Error fetching gallery:', err); }
            };

            const fetchReservations = async (courtId, date) => {
                try {
                    const res = await fetch(`/api/activity/reservations/${courtId}/${date}`);
                    const data = await res.json();
                    setReservations(data);
                } catch (err) { console.error('Error fetching reservations:', err); }
            };

            const submitEvent = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/activity/events', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ...newEvent, courtId: activeCourt.id })
                    });
                    if (res.ok) {
                        setShowEventForm(false);
                        fetchEvents(activeCourt.id);
                        setNewEvent({ title: '', eventType: 'משחק אימון', description: '', eventDate: '' });
                    } else {
                        const error = await res.json();
                        alert(error.message || 'שגיאה בפתיחת אירוע');
                    }
                } catch (err) { console.error('Error creating event:', err); }
            };

            const uploadMedia = async (e) => {
                e.preventDefault();
                if (!selectedFile) return alert('נא לבחור קובץ');

                const formData = new FormData();
                formData.append('mediaFile', selectedFile);
                formData.append('courtId', activeCourt.id);

                try {
                    const res = await fetch('/api/activity/gallery', {
                        method: 'POST',
                        body: formData
                    });
                    if (res.ok) {
                        fetchGallery(activeCourt.id);
                        setSelectedFile(null);
                        e.target.reset();
                    } else {
                        const error = await res.json();
                        alert(error.message || 'שגיאה בהעלאת קובץ');
                    }
                } catch (err) { console.error('Error uploading media:', err); }
            };

            const handleBookSlot = async (startTime, endTime) => {
                try {
                    setBookingStatus('משריין...');
                    const res = await fetch('/api/activity/reservations', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            courtId: activeCourt.id,
                            date: selectedDate,
                            startTime: startTime,
                            endTime: endTime
                        })
                    });

                    if (res.ok) {
                        setBookingStatus('המגרש שוריין בהצלחה!');
                        fetchReservations(activeCourt.id, selectedDate);

                        // שידור העדכון בזמן אמת לכל שאר המשתמשים באותו מגרש
                        socket.emit('reservation_update', { courtId: activeCourt.id, date: selectedDate });

                        setTimeout(() => setBookingStatus(''), 3000);
                    } else {
                        const error = await res.json();
                        setBookingStatus(error.message || 'שגיאה בשריון');
                        setTimeout(() => setBookingStatus(''), 3000);
                    }
                } catch (err) {
                    console.error('Error booking slot:', err);
                    setBookingStatus('שגיאת רשת');
                }
            };

            const handleCancelBooking = async (reservationId) => {
                if (!window.confirm("האם אתה בטוח שברצונך לבטל את השריון?")) return;

                try {
                    setBookingStatus('מבטל שריון...');
                    const res = await fetch(`/api/activity/reservations/${reservationId}`, {
                        method: 'DELETE'
                    });

                    if (res.ok) {
                        setBookingStatus('השריון בוטל בהצלחה!');
                        fetchReservations(activeCourt.id, selectedDate);

                        // שידור העדכון בזמן אמת לכל שאר המשתמשים באותו מגרש
                        socket.emit('reservation_update', { courtId: activeCourt.id, date: selectedDate });

                        setTimeout(() => setBookingStatus(''), 3000);
                    } else {
                        const error = await res.json();
                        setBookingStatus(error.message || 'שגיאה בביטול השריון');
                        setTimeout(() => setBookingStatus(''), 3000);
                    }
                } catch (err) {
                    console.error('Error canceling slot:', err);
                    setBookingStatus('שגיאת רשת בביטול');
                }
            };

            const clearBoard = () => {
                const canvas = canvasRef.current;
                if (canvas) {
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            };
            const startDrawing = (e) => {
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(e.nativeEvent.offsetX, e.nativeEvent.offsetY);
                setIsDrawing(true);
            };
            const draw = (e) => {
                if (!isDrawing) return;
                const ctx = canvasRef.current.getContext('2d');
                ctx.lineTo(e.nativeEvent.offsetX, e.nativeEvent.offsetY);
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 3;
                ctx.stroke();
            };
            const stopDrawing = () => setIsDrawing(false);

            const generateTimeSlots = () => {
                const slots = [];
                for (let i = 8; i <= 22; i++) {
                    const startTime = `${i.toString().padStart(2, '0')}:00`;
                    const endTime = `${(i + 1).toString().padStart(2, '0')}:00`;

                    const existingReservation = reservations.find(r => r.startTime === startTime);

                    slots.push({
                        startTime,
                        endTime,
                        isBooked: !!existingReservation,
                        bookedBy: existingReservation ? existingReservation.username : null,
                        reservationId: existingReservation ? existingReservation._id : null
                    });
                }
                return slots;
            };

            if (!activeCourt.id) return <div style={{ flex: 2, padding: '20px', background: 'white', borderRadius: '15px', textAlign: 'center' }}><h3>בחר מגרש כדי לפתוח סביבת עבודה</h3></div>;

            return (
                <div style={{ flex: 2, backgroundColor: 'white', borderRadius: '20px', boxShadow: '0 10px 30px rgba(0,0,0,0.08)', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
                    <div style={{ display: 'flex', background: '#f8f9fa', borderBottom: '2px solid #ecf0f1', overflowX: 'auto', whiteSpace: 'nowrap' }}>
                        <button onClick={() => setActiveTab('schedule')} style={{ flex: 1, padding: '15px', border: 'none', background: activeTab === 'schedule' ? 'white' : 'transparent', color: activeTab === 'schedule' ? '#2980b9' : '#7f8c8d', fontWeight: 'bold', borderBottom: activeTab === 'schedule' ? '3px solid #2980b9' : 'none', cursor: 'pointer', transition: '0.2s', minWidth: '120px' }}>🗓️ שריון לו"ז</button>
                        <button onClick={() => setActiveTab('events')} style={{ flex: 1, padding: '15px', border: 'none', background: activeTab === 'events' ? 'white' : 'transparent', color: activeTab === 'events' ? '#2980b9' : '#7f8c8d', fontWeight: 'bold', borderBottom: activeTab === 'events' ? '3px solid #2980b9' : 'none', cursor: 'pointer', transition: '0.2s', minWidth: '120px' }}>📅 אירועים</button>
                        <button onClick={() => setActiveTab('gallery')} style={{ flex: 1, padding: '15px', border: 'none', background: activeTab === 'gallery' ? 'white' : 'transparent', color: activeTab === 'gallery' ? '#2980b9' : '#7f8c8d', fontWeight: 'bold', borderBottom: activeTab === 'gallery' ? '3px solid #2980b9' : 'none', cursor: 'pointer', transition: '0.2s', minWidth: '120px' }}>📸 גלריה</button>
                        <button onClick={() => setActiveTab('tactics')} style={{ flex: 1, padding: '15px', border: 'none', background: activeTab === 'tactics' ? 'white' : 'transparent', color: activeTab === 'tactics' ? '#2980b9' : '#7f8c8d', fontWeight: 'bold', borderBottom: activeTab === 'tactics' ? '3px solid #2980b9' : 'none', cursor: 'pointer', transition: '0.2s', minWidth: '120px' }}>🖍️ טקטיקה</button>
                    </div>

                    <div style={{ padding: '20px', flex: 1, overflowY: 'auto' }}>

                        {activeTab === 'schedule' && (
                            <div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', flexWrap: 'wrap', gap: '10px' }}>
                                    <h3 style={{ margin: 0, color: '#2c3e50' }}>זמינות המגרש</h3>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                        <label style={{ fontWeight: 'bold', color: '#7f8c8d' }}>בחר תאריך:</label>
                                        <input
                                            type="date"
                                            value={selectedDate}
                                            onChange={(e) => setSelectedDate(e.target.value)}
                                            min={new Date().toISOString().split('T')[0]}
                                            style={{ padding: '8px', border: '1px solid #ddd', borderRadius: '8px' }}
                                        />
                                    </div>
                                </div>

                                {bookingStatus && (
                                    <div style={{ padding: '10px', marginBottom: '15px', backgroundColor: bookingStatus.includes('בהצלחה') ? '#d4edda' : '#f8d7da', color: bookingStatus.includes('בהצלחה') ? '#155724' : '#721c24', borderRadius: '8px', textAlign: 'center', fontWeight: 'bold' }}>
                                        {bookingStatus}
                                    </div>
                                )}

                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(180px, 1fr))', gap: '10px' }}>
                                    {generateTimeSlots().map((slot, index) => (
                                        <div key={index} style={{
                                            border: '1px solid #ddd',
                                            borderRadius: '8px',
                                            padding: '10px',
                                            backgroundColor: slot.isBooked ? '#f1f2f6' : '#ffffff',
                                            display: 'flex',
                                            flexDirection: 'column',
                                            alignItems: 'center',
                                            gap: '8px'
                                        }}>
                                            <b style={{ fontSize: '18px', color: slot.isBooked ? '#7f8c8d' : '#2c3e50' }}>{slot.startTime} - {slot.endTime}</b>

                                            {slot.isBooked ? (
                                                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '5px', width: '100%' }}>
                                                    <div style={{ color: '#e74c3c', fontSize: '13px', fontWeight: 'bold', textAlign: 'center' }}>
                                                        תפוס ע"י {slot.bookedBy} 🔒
                                                    </div>
                                                    {currentUser === slot.bookedBy && (
                                                        <button
                                                            onClick={() => handleCancelBooking(slot.reservationId)}
                                                            style={{
                                                                backgroundColor: '#e74c3c',
                                                                color: 'white',
                                                                border: 'none',
                                                                padding: '4px 8px',
                                                                borderRadius: '5px',
                                                                cursor: 'pointer',
                                                                fontSize: '12px',
                                                                fontWeight: 'bold',
                                                                width: '100%',
                                                                marginTop: '5px'
                                                            }}
                                                        >
                                                            בטל שריון
                                                        </button>
                                                    )}
                                                </div>
                                            ) : (
                                                <button
                                                    onClick={() => handleBookSlot(slot.startTime, slot.endTime)}
                                                    style={{
                                                        backgroundColor: '#2ecc71',
                                                        color: 'white',
                                                        border: 'none',
                                                        padding: '6px 12px',
                                                        borderRadius: '15px',
                                                        cursor: 'pointer',
                                                        fontWeight: 'bold',
                                                        width: '100%'
                                                    }}
                                                >
                                                    שריין שעה זו
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'events' && (
                            <div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                                    <h3 style={{ margin: 0, color: '#2c3e50' }}>אירועים קרובים ב{activeCourt.name}</h3>
                                    <button onClick={() => setShowEventForm(!showEventForm)} style={{ background: '#27ae60', color: 'white', border: 'none', padding: '10px 15px', borderRadius: '8px', fontWeight: 'bold', cursor: 'pointer' }}>
                                        {showEventForm ? 'ביטול' : '➕ פתח אירוע חדש'}
                                    </button>
                                </div>

                                {showEventForm && (
                                    <form onSubmit={submitEvent} style={{ background: '#f1f2f6', padding: '15px', borderRadius: '10px', marginBottom: '20px', display: 'flex', flexDirection: 'column', gap: '10px' }}>
                                        <input type="text" placeholder="כותרת האירוע (למשל: טורניר שבת בבוקר)" required value={newEvent.title} onChange={e => setNewEvent({ ...newEvent, title: e.target.value })} style={{ padding: '10px', borderRadius: '5px', border: '1px solid #ddd' }} />
                                        <div style={{ display: 'flex', gap: '10px' }}>
                                            <select value={newEvent.eventType} onChange={e => setNewEvent({ ...newEvent, eventType: e.target.value })} style={{ flex: 1, padding: '10px', borderRadius: '5px', border: '1px solid #ddd' }}>
                                                <option value="משחק אימון">משחק אימון</option>
                                                <option value="טורניר">טורניר</option>
                                                <option value="יום הולדת">יום הולדת</option>
                                                <option value="אחר">אחר</option>
                                            </select>
                                            <input type="datetime-local" required value={newEvent.eventDate} onChange={e => setNewEvent({ ...newEvent, eventDate: e.target.value })} style={{ flex: 1, padding: '10px', borderRadius: '5px', border: '1px solid #ddd' }} />
                                        </div>
                                        <textarea placeholder="תיאור האירוע ופרטים נוספים..." rows="3" value={newEvent.description} onChange={e => setNewEvent({ ...newEvent, description: e.target.value })} style={{ padding: '10px', borderRadius: '5px', border: '1px solid #ddd' }}></textarea>
                                        <button type="submit" style={{ background: '#3498db', color: 'white', border: 'none', padding: '10px', borderRadius: '5px', fontWeight: 'bold', cursor: 'pointer' }}>צור אירוע ופרסם</button>
                                    </form>
                                )}

                                {events.length === 0 ? (
                                    <div style={{ textAlign: 'center', color: '#7f8c8d', padding: '40px 0' }}>אין אירועים קרובים במגרש זה. תהיה הראשון לפתוח אחד!</div>
                                ) : (
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '15px' }}>
                                        {events.map(ev => (
                                            <div key={ev._id} style={{ background: 'white', borderLeft: '5px solid #3498db', padding: '15px', borderRadius: '8px', boxShadow: '0 2px 5px rgba(0,0,0,0.05)' }}>
                                                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                                    <h4 style={{ margin: '0 0 5px 0', color: '#2c3e50' }}>{ev.title} <span style={{ fontSize: '12px', background: '#ecf0f1', padding: '2px 8px', borderRadius: '10px', color: '#7f8c8d' }}>{ev.eventType}</span></h4>
                                                    <small style={{ color: '#e74c3c', fontWeight: 'bold' }}>{new Date(ev.eventDate).toLocaleString('he-IL')}</small>
                                                </div>
                                                <p style={{ margin: '5px 0', fontSize: '14px', color: '#555' }}>{ev.description}</p>
                                                <small style={{ color: '#95a5a6' }}>נוצר על ידי: {ev.creator}</small>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'gallery' && (
                            <div>
                                <form onSubmit={uploadMedia} style={{ display: 'flex', gap: '10px', marginBottom: '20px', background: '#f1f2f6', padding: '15px', borderRadius: '10px' }}>
                                    <input type="file" accept="image/*,video/*" onChange={e => setSelectedFile(e.target.files[0])} style={{ flex: 1 }} />
                                    <button type="submit" style={{ background: '#9b59b6', color: 'white', border: 'none', padding: '10px 20px', borderRadius: '5px', fontWeight: 'bold', cursor: 'pointer' }}>העלה לגלריה ⬆️</button>
                                </form>

                                {gallery.length === 0 ? (
                                    <div style={{ textAlign: 'center', color: '#7f8c8d', padding: '40px 0' }}>הגלריה ריקה. צלם את המגרש ושתף עם כולם!</div>
                                ) : (
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(150px, 1fr))', gap: '15px' }}>
                                        {gallery.map(media => (
                                            <div key={media._id} style={{ borderRadius: '10px', overflow: 'hidden', boxShadow: '0 3px 8px rgba(0,0,0,0.1)', height: '150px' }}>
                                                {media.fileType === 'image' ? (
                                                    <img src={media.fileUrl} alt="מגרש" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                                                ) : (
                                                    <video src={media.fileUrl} controls style={{ width: '100%', height: '100%', objectFit: 'cover', background: 'black' }} />
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'tactics' && (
                            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                                <p style={{ color: '#7f8c8d', marginBottom: '10px' }}>צייר כאן כדי להסביר מהלכים טקטיים לפני המשחק</p>
                                <canvas
                                    ref={canvasRef} width="500" height="300"
                                    style={{ border: '2px solid #2c3e50', borderRadius: '10px', backgroundColor: '#e0f7fa', cursor: 'crosshair', maxWidth: '100%' }}
                                    onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing}
                                />
                                <button onClick={clearBoard} style={{ marginTop: '15px', padding: '10px 30px', backgroundColor: '#e74c3c', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold' }}>נקה לוח</button>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const rootElement = document.getElementById('react-tactics-root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<CourtWorkspace />);
    </script>
</body>

</html>
